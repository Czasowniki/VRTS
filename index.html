<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VRTS - Zegar</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --ui-white: #ffffff; }
        body { margin: 0; padding: 0; width: 100%; height: 100vh; background-color: #ffffff; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; display: block; outline: none; }
        
        .ui-element {
            position: absolute; background: none; border: none; padding: 0;
            cursor: pointer; z-index: 100; mix-blend-mode: difference;
            color: var(--ui-white); fill: var(--ui-white); outline: none;
        }

        .brand-btn { top: 32px; font-weight: 700; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; }
        .brand-label { left: 32px; }
        .brand-cz { right: 32px; }

        .icon-btn { width: 28px; height: 28px; bottom: 40px; display: flex; align-items: center; justify-content: center; }
        .btn-theme { left: 32px; }
        .btn-pause { left: 36%; transform: translateX(-50%); }
        .btn-action { left: 63%; transform: translateX(-50%); }
        .btn-reset { right: 32px; }
    </style>
</head>
<body>

    <button class="ui-element brand-btn brand-label">VRTS</button>
    <button class="ui-element brand-btn brand-cz">CZASOWNIKI</button>

    <button class="ui-element icon-btn btn-theme" onclick="document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(18, 18, 18)' ? '#ffffff' : '#121212'">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18V4c4.42 0 8 3.58 8 8s-3.58 8-8 8z"/></svg>
    </button>

    <button class="ui-element icon-btn btn-pause" onclick="const mv = document.querySelector('#mv'); mv.paused ? mv.play() : mv.pause()">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <button class="ui-element icon-btn btn-action" onclick="document.querySelector('#mv').activateAR()">
        <span style="font-weight:800; font-size:16px;">AR</span>
    </button>

    <button class="ui-element icon-btn btn-reset" onclick="const mv = document.querySelector('#mv'); mv.cameraOrbit = '180deg 75deg 100%'; mv.cameraTarget = '0m 0.20m 0m'">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
    </button>

    <model-viewer 
        id="mv"
        src="VRTS.glb" 
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls disable-pan
        shadow-intensity="1"
        autoplay
        interaction-prompt="none"
        camera-orbit="180deg 75deg 100%" 
        camera-target="0m 0.20m 0m"
        loading="eager">
    </model-viewer>

</body>
</html>
